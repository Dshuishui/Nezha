syntax = "proto3";
 
option go_package="./;raftrpc";

/* 
    this rpc is only for Raft consistency between nodes
*/

service Raft {
  rpc AppendEntriesInRaft (AppendEntriesInRaftRequest) returns (AppendEntriesInRaftResponse) {}
  rpc HeartbeatInRaft (AppendEntriesInRaftRequest) returns (AppendEntriesInRaftResponse) {}
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse) {}
  // InstallSSTable ships state-machine files from the leader to a follower. Client
  // streaming: every message repeats the header, Data carries one chunk of one file.
  // Kind says how the follower must interpret them: a span of log indexes whose entries
  // it may then skip replaying (the LSM-Raft baseline), or a full snapshot that replaces
  // its state (the role InstallSnapshot plays in standard Raft).
  rpc InstallSSTable (stream InstallSSTableRequest) returns (InstallSSTableResponse) {}
}
 
message AppendEntriesInRaftRequest{
  int32 Term = 1;
  int32 LeaderId = 2; 
  int32 PrevLogIndex = 3;
  int32 PrevLogTerm = 4;
  repeated LogEntry Entries = 5;
  int32 LeaderCommit = 6;
}

message LogEntry{
  DetailCod Command = 1;
  int32 Term = 2;
}

message DetailCod{
  int32 Index = 1;
  int32 Term = 2;
  string OpType = 3;
  string Key = 4;
  string Value = 5;
  int64 SeqId = 6;
  int64 ClientId = 7;
  int64 FileVersion = 8;
}

message AppendEntriesInRaftResponse{
  int32 Term = 1;
  bool Success = 2;
  int32 ConflictIndex = 3;
  int32 ConflictTerm = 4;
}

message RequestVoteRequest{
  int32 Term = 1;
  int32 CandidateId = 2;
  int32 LastLogIndex = 3;
  int32 LastLogTerm = 4;
}

message RequestVoteResponse{
  int32 Term = 1;
  bool VoteGranted = 2;
}

// InstallSSTableKind distinguishes the two things the transport can carry. It is an
// explicit field rather than a convention over the index fields (such as SpanStart == 0
// meaning "snapshot"): an implicit protocol agreement eventually bites.
enum InstallSSTableKind {
  // SPAN: the files hold the state changes of log indexes [SpanStart, SpanEnd]. The
  // follower must already be applied through SpanStart-1, otherwise it answers GAP.
  SPAN = 0;
  // SNAPSHOT: the files hold the complete state as of SpanEnd. There is no lower-bound
  // requirement on the receiver -- that is the whole point of a snapshot. SpanStart and
  // OldestAvailable are unused; LastIncludedTerm is required.
  SNAPSHOT = 1;
}

message InstallSSTableRequest{
  int32 Term = 1;
  int32 LeaderId = 2;
  int64 SpanStart = 3;        // SPAN: first log index covered, inclusive. Unused for SNAPSHOT.
  int64 SpanEnd = 4;          // last log index covered, inclusive (SNAPSHOT: lastIncludedIndex)
  int64 OldestAvailable = 5;  // SPAN: start of the oldest span the leader can still send (0 = unknown)
  string FileName = 6;        // basename of the file this chunk belongs to
  int32 FileSeq = 7;          // ingestion order of FileName within the transfer, from 0
  int32 FileCount = 8;        // number of files in the transfer
  int64 Offset = 9;           // byte offset of Data inside FileName
  bytes Data = 10;
  bool Last = 11;             // final chunk of the transfer
  InstallSSTableKind Kind = 12;
  // LastIncludedTerm is the term of the entry at SpanEnd, required for SNAPSHOT: after
  // installing, SpanEnd becomes the follower's log base and it must be able to answer a
  // later AppendEntries consistency check at that index. Unused for SPAN.
  int32 LastIncludedTerm = 13;
}

enum InstallSSTableStatus {
  INGESTED = 0;      // files installed, Applied == SpanEnd (both kinds)
  SKIPPED = 1;       // follower had already applied through SpanEnd
  GAP = 2;           // SPAN only: follower's Applied < SpanStart-1; resend from Applied+1
  STALE_TERM = 3;    // Term is older than the follower's term
  FAILED = 4;        // installation error, see the follower log
}

message InstallSSTableResponse{
  int32 Term = 1;
  int64 Applied = 2;
  InstallSSTableStatus Status = 3;
}
